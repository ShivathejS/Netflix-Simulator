spring:
  application:
    name: content-service
  datasource:
    # Runs without machine-specific MySQL credentials by default. Set DB_URL,
    # DB_USERNAME, and DB_PASSWORD to use MySQL (or another supported database).
    url: ${DB_URL:jdbc:h2:file:./data/content_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
