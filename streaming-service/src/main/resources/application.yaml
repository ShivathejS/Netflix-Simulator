spring:
  application:
    name: streaming-service

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: streaming-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.netflix.streamingservice.event.VideoEncodedEvent


server:
  port: 8084


aws:
  # Local S3Mock defaults. Override these variables for a real AWS S3 bucket.
  access-key: ${AWS_ACCESS_KEY:local-access-key}
  secret-key: ${AWS_SECRET_KEY:local-secret-key}
  region: ${AWS_REGION:us-east-1}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9090}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:true}
    bucket-name: ${AWS_BUCKET_NAME:netflix-streaming}
    presigned-url-expiry: 60

streaming:
  kafka:
    listener-enabled: ${KAFKA_LISTENER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
